name: E2E + AI Triage

on:
  pull_request:
  workflow_dispatch:
    inputs:
      break:
        description: 'Defects to inject (comma-separated): product-bug, test-bug, flaky, timeout, infra'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: write
  actions: read
  # Required by claude-code-action itself: it exchanges an OIDC token for its
  # GitHub App token. Needed even with API-key model auth.
  id-token: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # workflow_dispatch only: edit the working tree so the failure the agent
      # triages is plain wrong code, with no defect switchboard in the source.
      - name: Inject defects
        if: github.event.inputs.break != ''
        run: node scripts/apply-defect.mjs "${{ github.event.inputs.break }}"

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npx playwright test

      - name: Condense failure report
        if: steps.tests.outcome == 'failure'
        run: node scripts/condense-report.mjs

      - name: AI triage
        if: steps.tests.outcome == 'failure'
        id: triage
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # Skips the Claude Code GitHub App token exchange, which 401s unless
          # the App is installed on the repo. Triage only needs to read files
          # and write a verdict; the PR comment is posted by a later step.
          github_token: ${{ github.token }}
          use_foundry: "true"
          prompt: |
            Follow the instructions in .github/triage-prompt.md exactly.
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-4-8' }}
            --max-turns 20
            --allowedTools Read,Grep,Glob,Write
        env:
          CLAUDE_CODE_USE_FOUNDRY: 1
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE }}

      - name: Publish verdict to job summary
        if: steps.tests.outcome == 'failure'
        run: |
          if [ -f triage-verdict.md ]; then
            cat triage-verdict.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## AI Test Failure Triage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Triage produced no verdict (step outcome: \`${{ steps.triage.outcome }}\`). Raw failure input:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat triage-input.md >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Comment on PR
        if: steps.tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAGE_OUTCOME: ${{ steps.triage.outcome }}
        run: |
          if [ -s triage-verdict.md ]; then
            cp triage-verdict.md comment-body.md
          else
            {
              echo "## AI Test Failure Triage — no verdict produced"
              echo
              echo "The triage step reported outcome \`$TRIAGE_OUTCOME\` but wrote no"
              echo "\`triage-verdict.md\`. Diagnostics:"
              echo
              echo '```'
              echo "workspace root:"
              ls -la | sed 's/^/  /'
              echo '```'
              echo
              echo "### Raw failure input"
              echo
              if [ -s triage-input.md ]; then
                cat triage-input.md
              else
                echo "\`triage-input.md\` is missing or empty."
              fi
            } > comment-body.md
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment-body.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            triage-input.md
            triage-verdict.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
